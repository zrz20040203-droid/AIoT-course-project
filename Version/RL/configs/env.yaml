# Simulation environment config for BarrierNav-v0.
# Units: meters, seconds, degrees (converted internally).

world:
  width: 8.0            # lateral size of the area; leaving it counts as a collision
  length: 30.0          # start is near y=0, goal near y=length
  start_y: 1.0
  goal_radius: 1.0      # reaching within this distance of the goal = success
  num_barriers: [6, 14] # random count per episode (inclusive range)
  barrier_zone: [4.0, 26.0]  # y-range where barriers are spawned
  min_gap: 0.8          # min free space between two barriers (so a path usually exists)

agent:
  radius: 0.2
  dt: 0.2               # seconds per step
  max_speed: 1.0        # m/s
  accel: 1.0            # m/s^2 for FORWARD
  decel: 1.5            # m/s^2 for SLOW
  turn_rate: 90.0       # deg/s for LEFT/RIGHT (works at zero speed: differential drive)
  max_steps: 600

camera:
  hfov: 70.0            # horizontal field of view
  vfov: 55.0            # vertical field of view
  height: 0.25          # camera height above ground
  max_range: 8.0        # barriers further than this are not detected
  occlusion: 0.8        # drop a box if this fraction of it is covered by a nearer box

# Barrier classes, in YOLO class-id order. radius = collision radius range,
# height = physical height (sets the box height in the simulated image).
classes:
  - {name: cone,   radius: [0.12, 0.20], height: 0.45}
  - {name: wall,   radius: [0.50, 0.90], height: 1.00}
  - {name: pole,   radius: [0.05, 0.10], height: 1.60}
  - {name: person, radius: [0.22, 0.30], height: 1.70}

# YOLO-like detection noise. `level` scales jitter / miss / false-positive /
# confusion rates together (0 = perfect detector, 1 = default, 2 = harsh).
noise:
  level: 1.0
  center_jitter: 0.015  # std of box center offset (fraction of image)
  size_jitter: 0.08     # relative std of box width/height
  miss_prob: 0.05       # base probability a visible barrier is not detected
  miss_prob_small: 0.35 # extra miss probability for tiny boxes
  small_area: 0.004     # boxes below this normalized area count as "tiny"
  false_pos_rate: 0.15  # expected false positives per frame (Poisson)
  class_confusion: 0.05 # probability of reporting a wrong class
  frame_drop_prob: 0.01 # probability the whole frame returns no detections
  conf_mean: 0.80
  conf_std: 0.10
  fp_conf_mean: 0.40
  conf_threshold: 0.25  # detections below this are discarded, like YOLO's conf=

observation:
  max_detections: 8     # top-N closest detections kept in the observation

reward:
  progress: 1.0         # per meter of progress toward the goal
  collision: -50.0
  goal: 50.0
  step: -0.01
  unnecessary_stop: -0.1   # STOP while nothing is within stop_safe_dist
  stop_safe_dist: 1.5
